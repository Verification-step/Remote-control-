<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Remote Control</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#111}header{height:64px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{font-weight:700}.status{font-size:14px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#999;margin-right:7px}.layout{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 64px)}aside{background:#fff;border-right:1px solid #ddd;padding:20px}.device{border:1px solid #ddd;border-radius:12px;padding:14px;background:#fafafa}.device strong{display:block;margin-bottom:6px}.main{padding:24px;display:flex;flex-direction:column;align-items:center;gap:18px}.phone{width:min(360px,80vw);aspect-ratio:9/19.5;background:#111;border-radius:28px;padding:9px;box-shadow:0 10px 30px #0002}.screen{height:100%;border-radius:21px;background:#222;color:#aaa;display:flex;align-items:center;justify-content:center;text-align:center}.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.controls button{border:1px solid #ccc;background:#fff;border-radius:10px;padding:10px 16px}.danger{border-color:#c00!important;color:#b00}.hint{max-width:520px;text-align:center;color:#666;font-size:14px;line-height:1.5}@media(max-width:700px){.layout{grid-template-columns:1fr}aside{display:none}}
  </style>
</head>
<body>
<header><div class="brand">Remote Control</div><div class="status"><span class="dot"></span><span id="status">Disconnected</span></div></header>
<div class="layout">
  <aside><h3>Devices</h3><div class="device"><strong>My Android</strong><span id="deviceStatus">Offline</span></div></aside>
  <main class="main">
    <div class="phone"><div class="screen" id="screen">Live phone screen will appear here when a remote session is connected.</div></div>
    <div class="controls">
      <button onclick="alert('Back command will be sent by the real-time transport in the next phase.')">Back</button>
      <button onclick="alert('Home command will be sent by the real-time transport in the next phase.')">Home</button>
      <button onclick="alert('Recent-apps command will be sent by the real-time transport in the next phase.')">Recent</button>
      <button class="danger" onclick="disconnect()">Disconnect</button>
    </div>
    <div class="hint">This is the laptop control interface foundation. The next phase connects it to the Android client through an authenticated real-time/WebRTC session.</div>
  </main>
</div>
<script>
function disconnect(){document.getElementById('status').textContent='Disconnected';document.getElementById('deviceStatus').textContent='Offline';}
</script>
</body>
</html>
